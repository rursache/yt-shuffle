name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Prepare site
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::error::The YOUTUBE_API_KEY secret is not set"
            exit 1
          fi
          mkdir _site
          cp -r index.html css js _site/
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            APP_VERSION="$GITHUB_REF_NAME"
          else
            APP_VERSION="${GITHUB_SHA::7}"
          fi
          if ! printf '%s' "$APP_VERSION" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Unsupported version name $APP_VERSION"
            exit 1
          fi
          sed -i "s/__YOUTUBE_API_KEY__/$YOUTUBE_API_KEY/; s/__APP_VERSION__/$APP_VERSION/" _site/js/app.js
          if grep -Eq "__(YOUTUBE_API_KEY|APP_VERSION)__" _site/js/app.js; then
            echo "::error::A deploy placeholder was not replaced"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
